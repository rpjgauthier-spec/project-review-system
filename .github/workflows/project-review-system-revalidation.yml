name: Project Review System Revalidation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate PR 6 queue and open revision-14 Structural Optimization gate
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries main
          git checkout -B target origin/enforce-separated-pass-boundaries
          python skills/project-review-system/scripts/update_revalidation_queue.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/reviews/revalidation-queue.md
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate revision-14 queue after Normalization'
            git push origin HEAD:enforce-separated-pass-boundaries
          fi

          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path('skills/project-review-system')
          record_path = root / 'changes/2026-08-07-separated-pass-boundary-enforcement.json'
          record = json.loads(record_path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 14
          assert record.get('results', {}).get('Adversarial') == 'supported'
          assert record.get('results', {}).get('Interdependency') == 'supported'
          assert record.get('results', {}).get('Normalization') == 'supported'
          assert record['execution_completions']['Normalization']['passes'][0]['handoff']['sha256'] == '7cdea39a528e12f0f681990ff1cd32a3045d09e82be7a237100da1f0cc3d9c76'
          assert 'Structural Optimization' not in record.get('execution_gates', {})

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          queue = load('queue_for_gate', root / 'scripts/update_revalidation_queue.py')
          selector = load('selector_for_gate', root / 'scripts/select_execution_policy.py')
          target = queue.current_record_target_state_id(record)
          workload = {
              'schema_version': 1,
              'reviewer_subject_id': 'chatgpt-gpt-5.6-sol-pr6-revalidation',
              'activity': 'Structural Optimization',
              'target_state_id': target,
              'review_revision': 14,
              'workload_class': 'bounded-revalidation-pass-boundary-structural-optimization-v3',
              'stage_assessment': {
                  'single_pass_suitable': True,
                  'reasons': [
                      'The revision-14 Structural Optimization pass is bounded to whether the current completion-path controls can be simplified or reorganized without weakening supported invariants.',
                      'The prior Normalization handoff is exact and architectural redesign of orchestration remains explicitly deferred outside PR #6.'
                  ],
                  'subpasses': []
              },
              'fused_authorization': None,
              'notes': 'Fresh SEPARATED revision-14 Structural Optimization review consuming the exact Normalization handoff.'
          }
          capability = json.loads((root / 'config/default-execution-capability.json').read_text(encoding='utf-8'))
          gate = selector.build_gate(workload, capability)
          record.setdefault('execution_gates', {})['Structural Optimization'] = gate
          record['next_step_plan'] = {
              'consumer': 'current assistant message continuing PR #6',
              'current_state': 'Revision 14 queue is current after Normalization completion and a fresh artifact-bound Structural Optimization gate is durably recorded.',
              'procedure_coverage': 'Structural Optimization must consume the exact revision-14 Normalization handoff and test the proportionality and separation of the completion-path controls without expanding PR #6 into the deferred deterministic orchestration redesign.',
              'next_actions': [
                  f"Perform revision-14 Structural Optimization only using gate sha256:{gate['gate_sha256']}.",
                  'Assess retain/defer/simplify/merge/split/generate alternatives for the current changed-file, queue, pass chronology, identity-history, workflow, and record-state controls.',
                  'If supported, record only Structural Optimization completion/result with the exact inbound Normalization handoff and hand off to End-to-end validation.',
                  'If a material governed structural defect is found, apply reopening semantics instead of crediting the stage.'
              ]
          }
          record_path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          print('TARGET=' + target)
          print('GATE=' + gate['gate_sha256'])
          PY
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json
          git commit -m 'Open revision-14 Structural Optimization gate'
          git push origin HEAD:enforce-separated-pass-boundaries
