name: Project Review System Revalidation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate PR 6 queue and open revision-15 Structural Optimization gate
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries main
          git checkout -B target origin/enforce-separated-pass-boundaries
          python skills/project-review-system/scripts/update_revalidation_queue.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/reviews/revalidation-queue.md
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate revision-15 queue after Normalization'
            git push origin HEAD:enforce-separated-pass-boundaries
          fi
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          root = Path('skills/project-review-system')
          record_path = root / 'changes/2026-08-07-separated-pass-boundary-enforcement.json'
          record = json.loads(record_path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 15
          for stage in ('Adversarial','Interdependency','Normalization'):
              assert record.get('results', {}).get(stage) == 'supported'
          assert record['execution_completions']['Normalization']['passes'][0]['handoff']['sha256'] == '51dff3a80322ad908b003c4c41dd0f55fbf87edc13d15cc816c6703643be8380'
          assert 'Structural Optimization' not in record.get('execution_gates', {})
          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path); module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module); return module
          queue = load('queue_for_gate', root / 'scripts/update_revalidation_queue.py')
          selector = load('selector_for_gate', root / 'scripts/select_execution_policy.py')
          target = queue.current_record_target_state_id(record)
          workload = {'schema_version':1,'reviewer_subject_id':'chatgpt-gpt-5.6-sol-pr6-revalidation','activity':'Structural Optimization','target_state_id':target,'review_revision':15,'workload_class':'bounded-revalidation-pass-boundary-structural-optimization-v4','stage_assessment':{'single_pass_suitable':True,'reasons':['Revision 15 Structural Optimization is bounded to whether the expanded changed-files/artifact-binding correction creates duplicate ownership, unnecessary coupling, or controls that can be simplified without weakening invariants.','The exact Normalization handoff is available and this structural scope remains small enough for one SEPARATED pass.'],'subpasses':[]},'fused_authorization':None,'notes':'Fresh SEPARATED revision-15 Structural Optimization review consuming the exact Normalization handoff.'}
          capability = json.loads((root / 'config/default-execution-capability.json').read_text(encoding='utf-8'))
          gate = selector.build_gate(workload, capability)
          record.setdefault('execution_gates', {})['Structural Optimization'] = gate
          record['next_step_plan'] = {'consumer':'current assistant message continuing PR #6','current_state':'Revision 15 queue is current after Normalization completion and a fresh artifact-bound Structural Optimization gate is durably recorded.','procedure_coverage':'Assess control ownership, duplication, coupling, artifact-family boundaries, protected-control retention, and whether simplification would preserve the supported completion invariants.','next_actions':[f"Perform revision-15 Structural Optimization only using gate sha256:{gate['gate_sha256']}.",'If supported, record only Structural Optimization completion/result and hand off to End-to-end validation.','If a material structural defect is found, reopen instead of crediting the stage.']}
          record_path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          print('TARGET=' + target); print('GATE=' + gate['gate_sha256'])
          PY
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json
          git commit -m 'Open revision-15 Structural Optimization gate'
          python -m unittest discover -s skills/project-review-system/tests -p 'test_*.py'
          python skills/project-review-system/scripts/check_change_impact_coverage.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_pass_boundaries.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_execution_identity_history.py --base origin/main --head HEAD
          git push origin HEAD:enforce-separated-pass-boundaries
