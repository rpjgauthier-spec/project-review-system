name: Project Review System Revalidation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize PR 6 revision-15 record and verify final queue
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries main
          git checkout -B target origin/enforce-separated-pass-boundaries
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('skills/project-review-system')
          record_path = root / 'changes/2026-08-07-separated-pass-boundary-enforcement.json'
          mapping = json.loads((root / 'config/revalidation-map.json').read_text(encoding='utf-8'))
          record = json.loads(record_path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 15
          assert record['status'] == 'in_progress'
          for stage in mapping['stages']:
              assert record.get('results', {}).get(stage) == 'supported'
          evaluations = set(record.get('additional_evaluations', []))
          for change_class in record['change_classes']:
              evaluations.update(mapping['change_classes'][change_class]['evaluations'])
          expected = {
              'adaptive-execution', 'artifact-family', 'authority-conflict', 'duplicate-control',
              'execution-gate-enforcement', 'pass-boundary-enforcement', 'premature-completion',
              'protected-control-retention', 'reopening-chain', 'status-propagation', 'structural-validator'
          }
          assert evaluations == expected
          for evaluation in sorted(evaluations):
              assert record.get('results', {}).get(evaluation) == 'passed'
          assert record['execution_completions']['End-to-end validation']['passes'][0]['handoff']['sha256'] == 'd42e3b7aa74f9dfab8febbd19471c96db6ed496f8d375890d1017de3ffc6246e'
          record['status'] = 'complete'
          record['next_step_plan'] = {
              'consumer': 'post-PR6 follow-up planning',
              'current_state': 'Revision 15 is complete: all five semantic stages are supported and all eleven mapped evaluations passed. Final queue and protected CI must remain clear before merge.',
              'procedure_coverage': 'Final completion preserves the exact stage/evaluation evidence and records no new semantic credit.',
              'deferred_follow_up': [
                  'Make the mapped-evaluation layer explicit in the workflow/UI, or integrate evaluation completion into stage completion, so it is not a mostly hidden second review layer.',
                  'Proceed with the previously deferred deterministic orchestration and active-state/history decomposition refactor after PR #6.'
              ],
              'next_actions': [
                  'Regenerate the final revalidation queue from this completed state.',
                  'Run regression, changed-file coverage, pass-boundary, identity-history, and scoped final queue --check against the PR base/head.',
                  'Obtain protected GitHub Actions clearance before considering merge.'
              ]
          }
          record_path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          PY
          python skills/project-review-system/scripts/update_revalidation_queue.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json skills/project-review-system/reviews/revalidation-queue.md
          git commit -m 'Complete revision-15 revalidation'
          python -m unittest discover -s skills/project-review-system/tests -p 'test_*.py'
          python skills/project-review-system/scripts/check_change_impact_coverage.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_pass_boundaries.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_execution_identity_history.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/update_revalidation_queue.py --check --base origin/main --head HEAD
          git push origin HEAD:enforce-separated-pass-boundaries
