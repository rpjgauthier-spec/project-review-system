name: Project Review System Revalidation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate PR 6 queue and open revision-14 Interdependency gate
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries main
          git checkout -B target origin/enforce-separated-pass-boundaries
          python skills/project-review-system/scripts/update_revalidation_queue.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/reviews/revalidation-queue.md
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate revision-14 queue after Adversarial'
            git push origin HEAD:enforce-separated-pass-boundaries
          fi

          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path('skills/project-review-system')
          record_path = root / 'changes/2026-08-07-separated-pass-boundary-enforcement.json'
          record = json.loads(record_path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 14
          assert record.get('results', {}).get('Adversarial') == 'supported'
          assert record['execution_completions']['Adversarial']['passes'][0]['handoff']['sha256'] == 'ae545708474a52d97173071b2dafc6da4389d5e9156abf52b03654192b30503b'
          assert 'Interdependency' not in record.get('execution_gates', {})

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          queue = load('queue_for_gate', root / 'scripts/update_revalidation_queue.py')
          selector = load('selector_for_gate', root / 'scripts/select_execution_policy.py')
          target = queue.current_record_target_state_id(record)
          workload = {
              'schema_version': 1,
              'reviewer_subject_id': 'chatgpt-gpt-5.6-sol-pr6-revalidation',
              'activity': 'Interdependency',
              'target_state_id': target,
              'review_revision': 14,
              'workload_class': 'bounded-revalidation-pass-boundary-interdependency-v4',
              'stage_assessment': {
                  'single_pass_suitable': True,
                  'reasons': [
                      'The revision-14 Interdependency pass is bounded to direct authority, producer/consumer, propagation, fallback, queue, and validator contracts affected by the completion-path corrections.',
                      'The prior Adversarial handoff is exact and the direct dependency graph is small enough for one SEPARATED pass.'
                  ],
                  'subpasses': []
              },
              'fused_authorization': None,
              'notes': 'Fresh SEPARATED revision-14 Interdependency review consuming the exact Adversarial handoff.'
          }
          capability = json.loads((root / 'config/default-execution-capability.json').read_text(encoding='utf-8'))
          gate = selector.build_gate(workload, capability)
          record.setdefault('execution_gates', {})['Interdependency'] = gate
          record['next_step_plan'] = {
              'consumer': 'current assistant message continuing PR #6',
              'current_state': 'Revision 14 queue is current after Adversarial completion and a fresh artifact-bound Interdependency gate is durably recorded.',
              'procedure_coverage': 'Interdependency must consume the exact revision-14 Adversarial handoff and trace direct authority, namespace, current/historical target, propagation, fallback, and validator contracts.',
              'next_actions': [
                  f"Perform revision-14 Interdependency only using gate sha256:{gate['gate_sha256']}.",
                  'Verify the producer/consumer chain across changed-file coverage, queue collection, current-record detection, current-target rebinding, pass chronology, historical identity, and final workflow invocation.',
                  'If supported, record only Interdependency completion/result with the exact inbound Adversarial handoff and hand off to Normalization.',
                  'If a material governed defect is found, apply reopening semantics instead of crediting the stage.'
              ]
          }
          record_path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          print('TARGET=' + target)
          print('GATE=' + gate['gate_sha256'])
          PY
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json
          git commit -m 'Open revision-14 Interdependency gate'
          git push origin HEAD:enforce-separated-pass-boundaries
