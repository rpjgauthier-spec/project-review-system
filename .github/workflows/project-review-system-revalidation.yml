name: Project Review System Revalidation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record PR 6 revision-15 Adversarial completion
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries main
          git checkout -B target origin/enforce-separated-pass-boundaries
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('skills/project-review-system')
          record_path = root / 'changes/2026-08-07-separated-pass-boundary-enforcement.json'
          record = json.loads(record_path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 15
          gate = record['execution_gates']['Adversarial']
          assert gate['gate_sha256'] == '599b7417501c052bfac09dcb6e4a3a2b31f573eb9df1ed559cf9ff546102b9d9'
          assert 'Adversarial' not in record.get('execution_completions', {})
          assert 'Adversarial' not in record.get('results', {})
          def canonical_hash(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode('utf-8')).hexdigest()
          handoff = {
              'consumer': 'Interdependency',
              'findings': [
                  'No blocking reusable false-credit, stale-state, namespace, identity, chronology, or host-assurance bypass was identified in the revision-15 bounded scope.',
                  'The two files added to changed_files are now part of the governed artifact-state binding, so subsequent revision-15 gates are bound to the expanded target rather than reusing revision-14 evidence.',
                  'Changed-file coverage passes across the full PR base-to-head diff with the corrected declaration, and the top-level change-record namespace/filename-ID/current-PR binding controls remain intact.',
                  'The existing convergence procedure already covers the discovered omission class as incomplete changed-file coverage; no new reusable Adversarial attack class was identified.'
              ],
              'evidence': [
                  'skills/project-review-system/references/adversarial-review.md',
                  'skills/project-review-system/scripts/check_change_impact_coverage.py',
                  'skills/project-review-system/tests/test_check_change_impact_coverage.py',
                  'skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json',
                  'revision-15 target sha256:e732d30106010afac86d5aee9f6d26a69510e5c0117b8856eaa49477b8e88e36',
                  'revision-15 gate sha256:599b7417501c052bfac09dcb6e4a3a2b31f573eb9df1ed559cf9ff546102b9d9'
              ],
              'unresolved_conditions': [
                  'Interdependency, Normalization, Structural Optimization, End-to-end validation, mapped evaluations, and final protected CI clearance remain.'
              ]
          }
          handoff['sha256'] = canonical_hash(handoff)
          pass_item = {
              'pass_id': 'stage-main',
              'context_mode': 'SEPARATED',
              'status': 'complete',
              'execution_unit_id': 'pr6-r15-adversarial-stage-main-convergence-1',
              'boundary': {'kind':'declared-execution-unit','id':'assistant-message-pr6-r15-adversarial-convergence-1'},
              'handoff': handoff
          }
          completion = {
              'gate_sha256': gate['gate_sha256'],
              'target_state_id': gate['decision']['target_state_id'],
              'passes': [pass_item],
              'scratch_materialized': False,
              'scratch_cleanup_status': 'not_applicable',
              'retained_subpass_artifacts': []
          }
          record.setdefault('execution_completions', {})['Adversarial'] = completion
          record.setdefault('results', {})['Adversarial'] = 'supported'
          occurrence = {
              'review_revision': 15,
              'stage': 'Adversarial',
              'pass_id': 'stage-main',
              'gate_sha256': gate['gate_sha256'],
              'execution_unit_id': pass_item['execution_unit_id'],
              'boundary': pass_item['boundary'],
              'pass_evidence_sha256': canonical_hash(pass_item)
          }
          record.setdefault('execution_occurrence_history', []).append(occurrence)
          record['next_step_plan'] = {
              'consumer': 'next reviewer or assistant message continuing PR #6',
              'current_state': 'Revision 15 Adversarial is supported under convergence mode; the exact handoff targets Interdependency.',
              'procedure_coverage': 'The expanded changed-files artifact binding and established false-credit/stale-state/namespace/identity/chronology/host-assurance invariants remain supported.',
              'next_actions': [
                  'Regenerate the revision-15 queue from the Adversarial completion state.',
                  f"Consume exact Adversarial handoff sha256:{handoff['sha256']}.",
                  'Create a fresh revision-15 Interdependency gate against the current governed artifact target.',
                  'Perform revision-15 Interdependency only in the next assistant message.'
              ]
          }
          record_path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          print('HANDOFF=' + handoff['sha256'])
          print('PASS_EVIDENCE=' + occurrence['pass_evidence_sha256'])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json
          git commit -m 'Complete revision-15 Adversarial'
          python -m unittest discover -s skills/project-review-system/tests -p 'test_*.py'
          python skills/project-review-system/scripts/check_change_impact_coverage.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_pass_boundaries.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_execution_identity_history.py --base origin/main --head HEAD
          git push origin HEAD:enforce-separated-pass-boundaries
