name: Project Review System Revalidation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record PR 6 revision-15 Structural Optimization completion
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries main
          git checkout -B target origin/enforce-separated-pass-boundaries
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('skills/project-review-system')
          record_path = root / 'changes/2026-08-07-separated-pass-boundary-enforcement.json'
          record = json.loads(record_path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 15
          for stage in ('Adversarial','Interdependency','Normalization'):
              assert record.get('results', {}).get(stage) == 'supported'
          gate = record['execution_gates']['Structural Optimization']
          assert gate['gate_sha256'] == '0c1fcaa4f3df0ca000ed24de494ea93b06aa6533232d1775a13ab4b8ce3b6eb8'
          assert gate['decision']['target_state_id'] == 'sha256:e732d30106010afac86d5aee9f6d26a69510e5c0117b8856eaa49477b8e88e36'
          assert 'Structural Optimization' not in record.get('execution_completions', {})
          assert 'Structural Optimization' not in record.get('results', {})
          inbound = record['execution_completions']['Normalization']['passes'][0]['handoff']['sha256']
          assert inbound == '51dff3a80322ad908b003c4c41dd0f55fbf87edc13d15cc816c6703643be8380'
          def canonical_hash(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode('utf-8')).hexdigest()
          handoff = {
              'consumer': 'End-to-end validation',
              'findings': [
                  'No material unnecessary burden, duplicate authority, accidental coupling, or structurally inferior arrangement was identified in the revision-15 bounded scope.',
                  'Changed-file coverage, current-target queue validation, pass chronology, historical identity, the protected workflow, and the active change record retain distinct failure responsibilities or consumers, so consolidating them in PR #6 would weaken clarity or expand risk without removing material burden.',
                  'The two newly declared coverage artifacts belong in the same governed artifact family but do not justify merging their checker/test responsibilities with queue or chronology controls.',
                  'The broader deterministic orchestration and active-state/history decomposition remains a justified follow-up redesign rather than an in-PR correction.'
              ],
              'evidence': [
                  'skills/project-review-system/references/structural-optimization-review.md',
                  'skills/project-review-system/scripts/check_change_impact_coverage.py',
                  'skills/project-review-system/scripts/update_revalidation_queue.py',
                  'skills/project-review-system/scripts/check_pass_boundaries.py',
                  'skills/project-review-system/scripts/check_execution_identity_history.py',
                  '.github/workflows/project-review-system-revalidation.yml',
                  'skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json',
                  'revision-15 Normalization handoff sha256:51dff3a80322ad908b003c4c41dd0f55fbf87edc13d15cc816c6703643be8380'
              ],
              'unresolved_conditions': [
                  'End-to-end validation, mapped evaluations, final queue regeneration, and final protected CI clearance remain.',
                  'The deterministic orchestration/state-decomposition redesign is deferred to a follow-up rather than expanding PR #6.'
              ]
          }
          handoff['sha256'] = canonical_hash(handoff)
          pass_item = {
              'pass_id': 'stage-main',
              'context_mode': 'SEPARATED',
              'status': 'complete',
              'execution_unit_id': 'pr6-r15-structural-optimization-stage-main-1',
              'boundary': {'kind':'declared-execution-unit','id':'assistant-message-pr6-r15-structural-optimization-1'},
              'inbound_handoff_sha256': inbound,
              'handoff': handoff
          }
          completion = {
              'gate_sha256': gate['gate_sha256'],
              'target_state_id': gate['decision']['target_state_id'],
              'passes': [pass_item],
              'scratch_materialized': False,
              'scratch_cleanup_status': 'not_applicable',
              'retained_subpass_artifacts': []
          }
          record.setdefault('execution_completions', {})['Structural Optimization'] = completion
          record.setdefault('results', {})['Structural Optimization'] = 'supported'
          occurrence = {
              'review_revision': 15,
              'stage': 'Structural Optimization',
              'pass_id': 'stage-main',
              'gate_sha256': gate['gate_sha256'],
              'execution_unit_id': pass_item['execution_unit_id'],
              'boundary': pass_item['boundary'],
              'pass_evidence_sha256': canonical_hash(pass_item)
          }
          record.setdefault('execution_occurrence_history', []).append(occurrence)
          record['next_step_plan'] = {
              'consumer': 'next reviewer or assistant message continuing PR #6',
              'current_state': 'Revision 15 Adversarial, Interdependency, Normalization, and Structural Optimization are supported; the exact Structural Optimization handoff targets End-to-end validation.',
              'procedure_coverage': 'The current control decomposition remains proportionate and preserves distinct consumers/failure responsibilities; broader orchestration redesign remains deferred.',
              'next_actions': [
                  'Regenerate the revision-15 queue from the Structural Optimization completion state.',
                  f"Consume exact Structural Optimization handoff sha256:{handoff['sha256']}.",
                  'Create a fresh revision-15 End-to-end validation gate against the current governed artifact target.',
                  'Perform revision-15 End-to-end validation only in the next assistant message.'
              ]
          }
          record_path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          print('HANDOFF=' + handoff['sha256'])
          print('PASS_EVIDENCE=' + occurrence['pass_evidence_sha256'])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json
          git commit -m 'Complete revision-15 Structural Optimization'
          python -m unittest discover -s skills/project-review-system/tests -p 'test_*.py'
          python skills/project-review-system/scripts/check_change_impact_coverage.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_pass_boundaries.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_execution_identity_history.py --base origin/main --head HEAD
          git push origin HEAD:enforce-separated-pass-boundaries
