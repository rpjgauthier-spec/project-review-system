name: Project Review System Revalidation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render generated revalidation queue
        run: |
          python skills/project-review-system/scripts/update_revalidation_queue.py
          echo '---BEGIN-REVALIDATION-QUEUE---'
          cat skills/project-review-system/reviews/revalidation-queue.md
          echo '---END-REVALIDATION-QUEUE---'
