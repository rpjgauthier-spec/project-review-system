name: Project Review System Revalidation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate PR 6 queue and open revision-15 End-to-end validation gate
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries main
          git checkout -B target origin/enforce-separated-pass-boundaries
          python skills/project-review-system/scripts/update_revalidation_queue.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/reviews/revalidation-queue.md
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate revision-15 queue after Structural Optimization'
            git push origin HEAD:enforce-separated-pass-boundaries
          fi
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          root = Path('skills/project-review-system')
          record_path = root / 'changes/2026-08-07-separated-pass-boundary-enforcement.json'
          record = json.loads(record_path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 15
          for stage in ('Adversarial','Interdependency','Normalization','Structural Optimization'):
              assert record.get('results', {}).get(stage) == 'supported'
          assert record['execution_completions']['Structural Optimization']['passes'][0]['handoff']['sha256'] == 'd0fe4d04d0a7d8c231152017f4f0725e358c899f813e429a70bc18af2f9f0314'
          assert 'End-to-end validation' not in record.get('execution_gates', {})
          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path); module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module); return module
          queue = load('queue_for_gate', root / 'scripts/update_revalidation_queue.py')
          selector = load('selector_for_gate', root / 'scripts/select_execution_policy.py')
          target = queue.current_record_target_state_id(record)
          workload = {'schema_version':1,'reviewer_subject_id':'chatgpt-gpt-5.6-sol-pr6-revalidation','activity':'End-to-end validation','target_state_id':target,'review_revision':15,'workload_class':'bounded-revalidation-pass-boundary-end-to-end-v5','stage_assessment':{'single_pass_suitable':True,'reasons':['Revision 15 End-to-end validation is bounded to the integrated completion path after the expanded changed-files/artifact-binding correction.','Normal, stale-state/reopening, interrupted or partial evidence, history preservation, and final-completion paths can be traced in one SEPARATED pass.'],'subpasses':[]},'fused_authorization':None,'notes':'Fresh SEPARATED revision-15 End-to-end validation consuming the exact Structural Optimization handoff.'}
          capability = json.loads((root / 'config/default-execution-capability.json').read_text(encoding='utf-8'))
          gate = selector.build_gate(workload, capability)
          record.setdefault('execution_gates', {})['End-to-end validation'] = gate
          record['next_step_plan'] = {'consumer':'current assistant message continuing PR #6','current_state':'Revision 15 queue is current after Structural Optimization completion and a fresh artifact-bound End-to-end validation gate is durably recorded.','procedure_coverage':'Trace the integrated normal path, stale/current-target path, revision reopening, interrupted or partial completion rejection, historical occurrence preservation, mapped-evaluation/final-queue boundary, and protected final workflow.','next_actions':[f"Perform revision-15 End-to-end validation only using gate sha256:{gate['gate_sha256']}.",'Stop immediately on the first blocking integrated defect; non-blocking observations do not terminate the pass.','If supported, record only End-to-end completion/result and hand off to mapped evaluations/final completion work.']}
          record_path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          print('TARGET=' + target); print('GATE=' + gate['gate_sha256'])
          PY
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json
          git commit -m 'Open revision-15 End-to-end validation gate'
          python -m unittest discover -s skills/project-review-system/tests -p 'test_*.py'
          python skills/project-review-system/scripts/check_change_impact_coverage.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_pass_boundaries.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_execution_identity_history.py --base origin/main --head HEAD
          git push origin HEAD:enforce-separated-pass-boundaries
