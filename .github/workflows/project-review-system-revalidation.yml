name: Project Review System Revalidation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record PR 6 revision-14 Normalization completion
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries main
          git checkout -B target origin/enforce-separated-pass-boundaries
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('skills/project-review-system')
          record_path = root / 'changes/2026-08-07-separated-pass-boundary-enforcement.json'
          record = json.loads(record_path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 14
          assert record.get('results', {}).get('Interdependency') == 'supported'
          gate = record['execution_gates']['Normalization']
          assert gate['gate_sha256'] == 'd0747cff4837b78c666190c8f3f794214a3f32def96d5e56fb3c517986753b5f'
          assert 'Normalization' not in record.get('execution_completions', {})
          assert 'Normalization' not in record.get('results', {})
          inbound = record['execution_completions']['Interdependency']['passes'][0]['handoff']['sha256']
          assert inbound == '3403f45118842820e55cd5e2721d9a2372ec3c04045b1c916d540af7408423a4'

          def canonical_hash(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode('utf-8')).hexdigest()

          handoff = {
              'consumer': 'Structural Optimization',
              'findings': [
                  'No material unjustified terminology, status, identity, target-state, queue, or completion representation inconsistency remains in the revision-14 scope.',
                  'The canonical queue continues to distinguish final-completion OPEN/CLEAR state from ordered inter-stage progression, while stage results and execution-pass completion remain separate concepts.',
                  'Top-level change-record namespace and filename/internal-id identity are represented consistently where they control queue and current-record behavior.',
                  'SKILL.md names bare --check conceptually while the generated queue and CLI require explicit base/head; because the bare form fails closed with an actionable error and the protected workflow supplies scope, this is retained as non-material documentation precision rather than a control defect.'
              ],
              'evidence': [
                  'skills/project-review-system/references/normalization-review.md',
                  'skills/project-review-system/references/shared-control-model.md',
                  'skills/project-review-system/SKILL.md',
                  'skills/project-review-system/scripts/update_revalidation_queue.py',
                  'skills/project-review-system/reviews/revalidation-queue.md',
                  '.github/workflows/project-review-system-revalidation.yml',
                  'revision-14 Interdependency handoff sha256:3403f45118842820e55cd5e2721d9a2372ec3c04045b1c916d540af7408423a4'
              ],
              'unresolved_conditions': [
                  'Structural Optimization, End-to-end validation, mapped evaluations, and final queue/CI clearance remain.',
                  'A future documentation cleanup may make the SKILL.md example spell out --base/--head explicitly; no current safety or completion-credit path depends on that wording.'
              ]
          }
          handoff['sha256'] = canonical_hash(handoff)
          pass_item = {
              'pass_id': 'stage-main',
              'context_mode': 'SEPARATED',
              'status': 'complete',
              'execution_unit_id': 'pr6-r14-normalization-stage-main-1',
              'boundary': {'kind': 'declared-execution-unit', 'id': 'assistant-message-pr6-r14-normalization-1'},
              'inbound_handoff_sha256': inbound,
              'handoff': handoff
          }
          completion = {
              'gate_sha256': gate['gate_sha256'],
              'target_state_id': gate['decision']['target_state_id'],
              'passes': [pass_item],
              'scratch_materialized': False,
              'scratch_cleanup_status': 'not_applicable',
              'retained_subpass_artifacts': []
          }
          record.setdefault('execution_completions', {})['Normalization'] = completion
          record.setdefault('results', {})['Normalization'] = 'supported'
          occurrence = {
              'review_revision': 14,
              'stage': 'Normalization',
              'pass_id': 'stage-main',
              'gate_sha256': gate['gate_sha256'],
              'execution_unit_id': pass_item['execution_unit_id'],
              'boundary': pass_item['boundary'],
              'pass_evidence_sha256': canonical_hash(pass_item)
          }
          record.setdefault('execution_occurrence_history', []).append(occurrence)
          record['next_step_plan'] = {
              'consumer': 'next reviewer or assistant message continuing PR #6',
              'current_state': 'Revision 14 Adversarial, Interdependency, and Normalization are supported; the exact Normalization handoff targets Structural Optimization.',
              'procedure_coverage': 'Material terminology and representation are consistent while legitimate lifecycle distinctions remain explicit; the one bare --check wording difference is fail-closed and non-material.',
              'next_actions': [
                  'Regenerate the generated revalidation queue from the revision-14 Normalization completion state.',
                  f"Read exact Normalization handoff sha256:{handoff['sha256']} and the current Structural Optimization authority.",
                  'Create a fresh revision-14 Structural Optimization execution gate against the current governed artifact target.',
                  'Perform revision-14 Structural Optimization only in the next assistant message.'
              ]
          }
          record_path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          print('HANDOFF=' + handoff['sha256'])
          print('PASS_EVIDENCE=' + occurrence['pass_evidence_sha256'])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json
          git commit -m 'Complete revision-14 Normalization'
          python -m unittest discover -s skills/project-review-system/tests -p 'test_*.py'
          python skills/project-review-system/scripts/check_pass_boundaries.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_execution_identity_history.py --base origin/main --head HEAD
          git push origin HEAD:enforce-separated-pass-boundaries
