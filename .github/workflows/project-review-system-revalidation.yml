name: Project Review System Revalidation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record PR 6 revision-15 Interdependency completion
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries main
          git checkout -B target origin/enforce-separated-pass-boundaries
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('skills/project-review-system')
          record_path = root / 'changes/2026-08-07-separated-pass-boundary-enforcement.json'
          record = json.loads(record_path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 15
          assert record.get('results', {}).get('Adversarial') == 'supported'
          gate = record['execution_gates']['Interdependency']
          assert gate['gate_sha256'] == '01364b66b29497f4840d6fe82250e78b0ad4c23d357012152159a9b6bf737571'
          assert gate['decision']['target_state_id'] == 'sha256:e732d30106010afac86d5aee9f6d26a69510e5c0117b8856eaa49477b8e88e36'
          assert 'Interdependency' not in record.get('execution_completions', {})
          assert 'Interdependency' not in record.get('results', {})
          inbound = record['execution_completions']['Adversarial']['passes'][0]['handoff']['sha256']
          assert inbound == 'ccf31b60a903e3fa6b324ce64e517736578ba01f6d4f6d6ab83486a5723e38c4'
          def canonical_hash(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode('utf-8')).hexdigest()
          handoff = {
              'consumer': 'Normalization',
              'findings': [
                  'No material broken producer-consumer, authority, propagation, fallback, or validator contract was identified in the revision-15 bounded scope.',
                  'The active change record is the durable source for the expanded changed-files declaration; changed-file coverage verifies that declaration against the PR diff, and artifact-target calculation consumes the resulting governed set without creating a second authority.',
                  'The two newly declared coverage artifacts are now included in the revision-15 artifact binding, while the generated queue remains a derived consumer view and the protected workflow supplies one consistent PR base/head to coverage, chronology, history, and final queue validation.',
                  'Historical occurrence evidence remains additive and immutable; revision-14 evidence is preserved as history but cannot satisfy revision-15 current-state gates because the expanded target differs.'
              ],
              'evidence': [
                  'skills/project-review-system/references/interdependency-review.md',
                  'skills/project-review-system/scripts/check_change_impact_coverage.py',
                  'skills/project-review-system/scripts/update_revalidation_queue.py',
                  'skills/project-review-system/scripts/check_pass_boundaries.py',
                  'skills/project-review-system/scripts/check_execution_identity_history.py',
                  '.github/workflows/project-review-system-revalidation.yml',
                  'skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json',
                  'revision-15 Adversarial handoff sha256:ccf31b60a903e3fa6b324ce64e517736578ba01f6d4f6d6ab83486a5723e38c4'
              ],
              'unresolved_conditions': [
                  'Normalization, Structural Optimization, End-to-end validation, mapped evaluations, final queue regeneration, and final protected CI clearance remain.'
              ]
          }
          handoff['sha256'] = canonical_hash(handoff)
          pass_item = {
              'pass_id': 'stage-main',
              'context_mode': 'SEPARATED',
              'status': 'complete',
              'execution_unit_id': 'pr6-r15-interdependency-stage-main-1',
              'boundary': {'kind':'declared-execution-unit','id':'assistant-message-pr6-r15-interdependency-1'},
              'inbound_handoff_sha256': inbound,
              'handoff': handoff
          }
          completion = {
              'gate_sha256': gate['gate_sha256'],
              'target_state_id': gate['decision']['target_state_id'],
              'passes': [pass_item],
              'scratch_materialized': False,
              'scratch_cleanup_status': 'not_applicable',
              'retained_subpass_artifacts': []
          }
          record.setdefault('execution_completions', {})['Interdependency'] = completion
          record.setdefault('results', {})['Interdependency'] = 'supported'
          occurrence = {
              'review_revision': 15,
              'stage': 'Interdependency',
              'pass_id': 'stage-main',
              'gate_sha256': gate['gate_sha256'],
              'execution_unit_id': pass_item['execution_unit_id'],
              'boundary': pass_item['boundary'],
              'pass_evidence_sha256': canonical_hash(pass_item)
          }
          record.setdefault('execution_occurrence_history', []).append(occurrence)
          record['next_step_plan'] = {
              'consumer': 'next reviewer or assistant message continuing PR #6',
              'current_state': 'Revision 15 Adversarial and Interdependency are supported; the exact Interdependency handoff targets Normalization.',
              'procedure_coverage': 'The expanded changed-files declaration, artifact binding, queue/current-state path, chronology/history validators, and protected workflow form a coherent direct dependency chain.',
              'next_actions': [
                  'Regenerate the revision-15 queue from the Interdependency completion state.',
                  f"Consume exact Interdependency handoff sha256:{handoff['sha256']}.",
                  'Create a fresh revision-15 Normalization gate against the current governed artifact target.',
                  'Perform revision-15 Normalization only in the next assistant message.'
              ]
          }
          record_path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          print('HANDOFF=' + handoff['sha256'])
          print('PASS_EVIDENCE=' + occurrence['pass_evidence_sha256'])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json
          git commit -m 'Complete revision-15 Interdependency'
          python -m unittest discover -s skills/project-review-system/tests -p 'test_*.py'
          python skills/project-review-system/scripts/check_change_impact_coverage.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_pass_boundaries.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_execution_identity_history.py --base origin/main --head HEAD
          git push origin HEAD:enforce-separated-pass-boundaries
