name: Project Review System Revalidation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open PR 6 revision-12 Adversarial gate
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries
          git checkout -B target origin/enforce-separated-pass-boundaries
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json')
          record = json.loads(path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 12
          assert not record.get('execution_gates')
          assert not record.get('execution_completions')
          assert not record.get('results')

          gate = {"schema_version":1,"activity":"Adversarial","workload":{"schema_version":1,"reviewer_subject_id":"chatgpt-gpt-5.6-sol-pr6-revalidation","activity":"Adversarial","target_state_id":"sha256:7a6fe9c59814110e7b2b52b65142eb7a1dee89cc6bbfa892f7c0f5eb681c617a","review_revision":12,"workload_class":"bounded-revalidation-pass-boundary-convergence-v6","stage_assessment":{"single_pass_suitable":True,"reasons":["Revision 12 reopens the same bounded separated-pass architecture under the established convergence threshold after the final queue checker was made fail-closed for unscoped --check execution.","The bounded pass tests whether PR-scoped current-versus-historical target binding, fail-closed completion checking, and the existing pass-boundary/history controls still protect the six predeclared core invariants; one SEPARATED pass is suitable."],"subpasses":[]},"fused_authorization":None,"notes":"Fresh SEPARATED revision-12 Adversarial review under convergence mode; only blocking findings may invalidate the pass."},"capability":{"schema_version":1,"profile_id":"default-separated-v1","subject_id":"unmeasured-reviewer-separated-default","validation_status":"DEFAULT_SEPARATED","benchmark_suite":"none-default-separated","benchmark_evidence":"Built-in separated default; not a claim of measured reviewer capability.","fused_permissions":[]},"decision":{"schema_version":1,"activity":"Adversarial","target_state_id":"sha256:7a6fe9c59814110e7b2b52b65142eb7a1dee89cc6bbfa892f7c0f5eb681c617a","review_revision":12,"reviewer_subject_id":"chatgpt-gpt-5.6-sol-pr6-revalidation","workload_class":"bounded-revalidation-pass-boundary-convergence-v6","selected_mode":"SEPARATED","plan_kind":"ONE_PASS","execution_plan":[{"pass_id":"stage-main","scope":"Adversarial","context_mode":"SEPARATED"}],"fused_permission_id":None,"capability_profile_id":"default-separated-v1","capability_subject_id":"unmeasured-reviewer-separated-default","capability_validation_status":"DEFAULT_SEPARATED","capability_benchmark_suite":"none-default-separated","workload_sha256":"658a0747a95f6af44221f0f301727d164ee315d10c41d3933a3492c3e62c3d5c","capability_sha256":"605e501e8a274e2caea0a072d3f48c8e0a2429a9a8f94c994786f49e622449e5","assurance_boundary":"Semantic judgment determines whether one pass is suitable and which bounded subpasses require isolation. Deterministic policy defaults to SEPARATED, converts declared isolation requirements into ISOLATED subpasses, and permits FUSED only through exact pre-existing VALIDATED capability permission. The gate and completion validator enforce the recorded plan but do not prove the semantic assessment itself was correct."},"gate_sha256":"dba87eb7d463e7bee2c0f3652a3a57dec97552e3490514f0c9d121a7dba5e8e1"}

          record['execution_gates'] = {'Adversarial': gate}
          record['next_step_plan'] = {
              'consumer': 'current assistant message continuing PR #6',
              'current_state': 'Revision 12 queue is current and a fresh artifact-bound Adversarial gate is durably recorded.',
              'procedure_coverage': 'The gate is bound to the post-fail-closed-check governed target and the existing convergence threshold.',
              'next_actions': [
                  'Perform revision-12 Adversarial only using gate sha256:dba87eb7d463e7bee2c0f3652a3a57dec97552e3490514f0c9d121a7dba5e8e1.',
                  'Classify every material observation against the six convergence invariants before correction.',
                  'If no blocking defect is found, record only Adversarial completion/result and hand off to Interdependency.',
                  'If a blocking correction changes governed artifacts, increment review_revision and reopen the earliest affected stage.'
              ]
          }
          path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json
          git commit -m 'Open revision-12 Adversarial gate'
          git push origin HEAD:enforce-separated-pass-boundaries
