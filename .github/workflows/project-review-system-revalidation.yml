name: Project Review System Revalidation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate PR 6 revision-13 queue and open Adversarial gate
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries
          git checkout -B target origin/enforce-separated-pass-boundaries
          python skills/project-review-system/scripts/update_revalidation_queue.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/reviews/revalidation-queue.md
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate revision-13 revalidation queue'
            git push origin HEAD:enforce-separated-pass-boundaries
          fi

          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path('skills/project-review-system')
          record_path = root / 'changes/2026-08-07-separated-pass-boundary-enforcement.json'
          record = json.loads(record_path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 13
          assert not record.get('execution_gates')
          assert not record.get('execution_completions')
          assert not record.get('results')

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          queue = load('queue_for_gate', root / 'scripts/update_revalidation_queue.py')
          selector = load('selector_for_gate', root / 'scripts/select_execution_policy.py')
          target = queue.current_record_target_state_id(record)
          workload = {
              'schema_version': 1,
              'reviewer_subject_id': 'chatgpt-gpt-5.6-sol-pr6-revalidation',
              'activity': 'Adversarial',
              'target_state_id': target,
              'review_revision': 13,
              'workload_class': 'bounded-revalidation-pass-boundary-convergence-v7',
              'stage_assessment': {
                  'single_pass_suitable': True,
                  'reasons': [
                      'Revision 13 reopens the same bounded architecture after enforcing filename/internal-id correspondence for change records.',
                      'The pass is limited to testing the current-versus-historical identity and target-binding boundary plus the six established convergence invariants.'
                  ],
                  'subpasses': []
              },
              'fused_authorization': None,
              'notes': 'Fresh SEPARATED revision-13 Adversarial review under convergence mode; only blocking findings may invalidate the pass.'
          }
          capability = json.loads((root / 'config/default-execution-capability.json').read_text(encoding='utf-8'))
          gate = selector.build_gate(workload, capability)
          record['execution_gates'] = {'Adversarial': gate}
          record['next_step_plan'] = {
              'consumer': 'current assistant message continuing PR #6',
              'current_state': 'Revision 13 queue is current and a fresh artifact-bound Adversarial gate is durably recorded.',
              'procedure_coverage': 'The gate is bound to the filename/id-corrected governed artifact target under the existing convergence threshold.',
              'next_actions': [
                  f"Perform revision-13 Adversarial only using gate sha256:{gate['gate_sha256']}.",
                  'Classify every material observation against the six convergence invariants before correction.',
                  'If no blocking defect is found, record only Adversarial completion/result and hand off to Interdependency.',
                  'If a blocking correction changes governed artifacts, increment review_revision and reopen the earliest affected stage.'
              ]
          }
          record_path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          print('TARGET=' + target)
          print('GATE=' + gate['gate_sha256'])
          PY
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json
          git commit -m 'Open revision-13 Adversarial gate'
          git push origin HEAD:enforce-separated-pass-boundaries
