name: Project Review System Revalidation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct PR 6 coverage declaration and reopen revision 15
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries main
          git checkout -B target origin/enforce-separated-pass-boundaries
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('skills/project-review-system')
          path = root / 'changes/2026-08-07-separated-pass-boundary-enforcement.json'
          record = json.loads(path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 14
          assert 'End-to-end validation' in record.get('execution_gates', {})
          additions = [
              'skills/project-review-system/scripts/check_change_impact_coverage.py',
              'skills/project-review-system/tests/test_check_change_impact_coverage.py',
          ]
          changed = list(record.get('changed_files', []))
          for item in additions:
              if item not in changed:
                  changed.append(item)
          record['changed_files'] = sorted(changed)
          record['reason'] = record.get('reason','') + ' Revision-14 End-to-end validation then exercised the integrated changed-file coverage path and found that the revision-13 namespace correction modified check_change_impact_coverage.py and its regression test without adding those files to this record changed_files declaration. The coverage checker therefore correctly rejected PR #6. Adding those two governed files changes the artifact-state binding set, so revision-14 semantic gates become stale; revision-14 End-to-end receives no credit, review_revision increments to 15, and ordered semantic revalidation reopens at Adversarial.'
          record['review_revision'] = 15
          record['status'] = 'in_progress'
          record['execution_gates'] = {}
          record['execution_completions'] = {}
          record['results'] = {}
          record['next_step_plan'] = {
              'consumer': 'next reviewer or assistant message continuing PR #6',
              'current_state': 'Revision 15 is reopened at Adversarial after End-to-end validation found two governed files missing from changed_files; the declaration is corrected and prior durable occurrence history is preserved.',
              'procedure_coverage': 'Regenerate the queue from revision 15, compute the expanded current artifact target, then resume ordered semantic revalidation at Adversarial under convergence mode.',
              'next_actions': [
                  'Regenerate the revision-15 revalidation queue.',
                  'Create a fresh revision-15 Adversarial gate against the expanded governed artifact target.',
                  'Perform revision-15 Adversarial only in the next assistant message.'
              ]
          }
          path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json
          git commit -m 'Reopen revision 15 after coverage declaration failure'
          python skills/project-review-system/scripts/update_revalidation_queue.py
          git add skills/project-review-system/reviews/revalidation-queue.md
          git commit -m 'Regenerate revision-15 revalidation queue'
          python -m unittest discover -s skills/project-review-system/tests -p 'test_*.py'
          python skills/project-review-system/scripts/check_change_impact_coverage.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_execution_identity_history.py --base origin/main --head HEAD
          git push origin HEAD:enforce-separated-pass-boundaries
