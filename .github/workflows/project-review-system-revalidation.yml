name: Project Review System Revalidation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record PR 6 revision-14 Interdependency completion
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries main
          git checkout -B target origin/enforce-separated-pass-boundaries
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('skills/project-review-system')
          record_path = root / 'changes/2026-08-07-separated-pass-boundary-enforcement.json'
          record = json.loads(record_path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 14
          assert record.get('results', {}).get('Adversarial') == 'supported'
          gate = record['execution_gates']['Interdependency']
          assert gate['gate_sha256'] == '632728f2ef91bfbb7affd498b27ed4b5f053fad8f4c2644d0dccb1c7f617ed1e'
          assert 'Interdependency' not in record.get('execution_completions', {})
          assert 'Interdependency' not in record.get('results', {})
          inbound = record['execution_completions']['Adversarial']['passes'][0]['handoff']['sha256']
          assert inbound == 'ae545708474a52d97173071b2dafc6da4389d5e9156abf52b03654192b30503b'

          def canonical_hash(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode('utf-8')).hexdigest()

          handoff = {
              'consumer': 'Normalization',
              'findings': [
                  'No material producer-consumer, authority, propagation, fallback, or validator contract defect remains in the revision-14 completion path.',
                  'Changed-file coverage, canonical queue collection, and PR-scoped current-record detection now agree on top-level changes/*.json as the controlling record namespace; queue collection additionally enforces internal-id/filename correspondence.',
                  'The protected final workflow supplies the same PR base/head to changed-file coverage, pass/history validation, and final queue checking, so current-record rebinding and historical preservation consume a common review range.',
                  'Pass chronology and historical identity controls remain downstream safeguards; their broader internal diff parsing does not create a bypass because they validate only canonical top-level records and final queue checking independently fails closed on current-record identity and target state.'
              ],
              'evidence': [
                  'skills/project-review-system/references/interdependency-review.md',
                  'skills/project-review-system/scripts/check_change_impact_coverage.py',
                  'skills/project-review-system/scripts/update_revalidation_queue.py',
                  'skills/project-review-system/scripts/check_pass_boundaries.py',
                  'skills/project-review-system/scripts/check_execution_identity_history.py',
                  '.github/workflows/project-review-system-revalidation.yml',
                  'revision-14 Adversarial handoff sha256:ae545708474a52d97173071b2dafc6da4389d5e9156abf52b03654192b30503b'
              ],
              'unresolved_conditions': [
                  'Normalization, Structural Optimization, End-to-end validation, mapped evaluations, and final queue/CI clearance remain.',
                  'The chronology helper could later normalize its changed-record parser for conceptual symmetry, but the present difference does not alter canonical record ownership or permit false credit.'
              ]
          }
          handoff['sha256'] = canonical_hash(handoff)
          pass_item = {
              'pass_id': 'stage-main',
              'context_mode': 'SEPARATED',
              'status': 'complete',
              'execution_unit_id': 'pr6-r14-interdependency-stage-main-1',
              'boundary': {'kind': 'declared-execution-unit', 'id': 'assistant-message-pr6-r14-interdependency-1'},
              'inbound_handoff_sha256': inbound,
              'handoff': handoff
          }
          completion = {
              'gate_sha256': gate['gate_sha256'],
              'target_state_id': gate['decision']['target_state_id'],
              'passes': [pass_item],
              'scratch_materialized': False,
              'scratch_cleanup_status': 'not_applicable',
              'retained_subpass_artifacts': []
          }
          record.setdefault('execution_completions', {})['Interdependency'] = completion
          record.setdefault('results', {})['Interdependency'] = 'supported'
          occurrence = {
              'review_revision': 14,
              'stage': 'Interdependency',
              'pass_id': 'stage-main',
              'gate_sha256': gate['gate_sha256'],
              'execution_unit_id': pass_item['execution_unit_id'],
              'boundary': pass_item['boundary'],
              'pass_evidence_sha256': canonical_hash(pass_item)
          }
          record.setdefault('execution_occurrence_history', []).append(occurrence)
          record['next_step_plan'] = {
              'consumer': 'next reviewer or assistant message continuing PR #6',
              'current_state': 'Revision 14 Adversarial and Interdependency are supported; the exact Interdependency handoff targets Normalization.',
              'procedure_coverage': 'Direct authority, producer/consumer, namespace, PR-scope, current/historical target, propagation, fallback, chronology, and final-workflow contracts are coherent in the accessible revision-14 scope.',
              'next_actions': [
                  'Regenerate the generated revalidation queue from the revision-14 Interdependency completion state.',
                  f"Read exact Interdependency handoff sha256:{handoff['sha256']} and the current Normalization authority.",
                  'Create a fresh revision-14 Normalization execution gate against the current governed artifact target.',
                  'Perform revision-14 Normalization only in the next assistant message.'
              ]
          }
          record_path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          print('HANDOFF=' + handoff['sha256'])
          print('PASS_EVIDENCE=' + occurrence['pass_evidence_sha256'])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json
          git commit -m 'Complete revision-14 Interdependency'
          python -m unittest discover -s skills/project-review-system/tests -p 'test_*.py'
          python skills/project-review-system/scripts/check_pass_boundaries.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_execution_identity_history.py --base origin/main --head HEAD
          git push origin HEAD:enforce-separated-pass-boundaries
