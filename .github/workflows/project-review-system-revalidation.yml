name: Project Review System Revalidation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-revalidation-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate PR 6 queue, open revision-14 End-to-end gate, and probe integrated controls
        shell: bash
        run: |
          git fetch origin enforce-separated-pass-boundaries main
          git checkout -B target origin/enforce-separated-pass-boundaries
          python skills/project-review-system/scripts/update_revalidation_queue.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/project-review-system/reviews/revalidation-queue.md
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate revision-14 queue after Structural Optimization'
            git push origin HEAD:enforce-separated-pass-boundaries
          fi

          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path('skills/project-review-system')
          record_path = root / 'changes/2026-08-07-separated-pass-boundary-enforcement.json'
          record = json.loads(record_path.read_text(encoding='utf-8'))
          assert record['review_revision'] == 14
          for stage in ['Adversarial','Interdependency','Normalization','Structural Optimization']:
              assert record.get('results', {}).get(stage) == 'supported'
          assert record['execution_completions']['Structural Optimization']['passes'][0]['handoff']['sha256'] == '6fdcf034c69e9a2e4e4abdc13524f337cc3c8ca5f55bef8c061d28e3b9f369fb'
          assert 'End-to-end validation' not in record.get('execution_gates', {})

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          queue = load('queue_for_gate', root / 'scripts/update_revalidation_queue.py')
          selector = load('selector_for_gate', root / 'scripts/select_execution_policy.py')
          target = queue.current_record_target_state_id(record)
          workload = {
              'schema_version': 1,
              'reviewer_subject_id': 'chatgpt-gpt-5.6-sol-pr6-revalidation',
              'activity': 'End-to-end validation',
              'target_state_id': target,
              'review_revision': 14,
              'workload_class': 'bounded-revalidation-pass-boundary-end-to-end-v4',
              'stage_assessment': {
                  'single_pass_suitable': True,
                  'reasons': [
                      'The revision-14 End-to-end pass is bounded to representative integrated normal, stale/current-state, reopening/recovery, unauthorized completion, and final-completion paths for the corrected controls.',
                      'Mechanical queue generation and validator execution are deterministic setup/evidence; semantic path interpretation remains one SEPARATED pass.'
                  ],
                  'subpasses': []
              },
              'fused_authorization': None,
              'notes': 'Fresh SEPARATED revision-14 End-to-end validation consuming the exact Structural Optimization handoff.'
          }
          capability = json.loads((root / 'config/default-execution-capability.json').read_text(encoding='utf-8'))
          gate = selector.build_gate(workload, capability)
          record.setdefault('execution_gates', {})['End-to-end validation'] = gate
          record['next_step_plan'] = {
              'consumer': 'current assistant message continuing PR #6',
              'current_state': 'Revision 14 queue is current after Structural Optimization and a fresh artifact-bound End-to-end validation gate is durably recorded.',
              'procedure_coverage': 'Trace representative normal progression, stale/current artifact-state rejection, earlier-stage reopening/recovery, unauthorized completion prevention, historical evidence preservation, and final protected completion behavior.',
              'next_actions': [
                  f"Perform revision-14 End-to-end validation only using gate sha256:{gate['gate_sha256']}.",
                  'Use integrated deterministic probes plus semantic path tracing; non-blocking observations do not terminate the pass.',
                  'If supported, record only End-to-end completion/result with the exact inbound Structural Optimization handoff.',
                  'If a material integrated-path defect is found, reopen instead of crediting the stage.'
              ]
          }
          record_path.write_text(json.dumps(record, separators=(',', ':')), encoding='utf-8')
          print('TARGET=' + target)
          print('GATE=' + gate['gate_sha256'])
          PY
          git add skills/project-review-system/changes/2026-08-07-separated-pass-boundary-enforcement.json
          git commit -m 'Open revision-14 End-to-end validation gate'
          git push origin HEAD:enforce-separated-pass-boundaries

          python -m unittest discover -s skills/project-review-system/tests -p 'test_*.py'
          python skills/project-review-system/scripts/check_change_impact_coverage.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_pass_boundaries.py --base origin/main --head HEAD
          python skills/project-review-system/scripts/check_execution_identity_history.py --base origin/main --head HEAD

          set +e
          out=$(python skills/project-review-system/scripts/update_revalidation_queue.py --check --base origin/main --head HEAD 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -E 'ACTION REQUIRED|still require|in progress|unresolved|not complete|stale' >/dev/null
